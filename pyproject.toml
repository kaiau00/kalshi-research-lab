[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-research-lab"
version = "0.1.0"
description = "BTC 15-minute event-market recording, research, and guarded execution"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "websockets>=15,<16",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "boto3>=1.40,<2",
    "zstandard>=0.23,<1",
]

[project.scripts]
research-lab = "research_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_lab", "src/demo_execution", "src/candidate_study", "src/walk_forward_study",
            "src/edge_validation", "src/production_execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
